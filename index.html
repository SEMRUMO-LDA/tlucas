<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>t.lucas | Premium Algarve Transfers</title>
  <meta name="description"
    content="Airport transfers, private tours, and hiking trail support in the Algarve and Costa Vicentina. 30+ years of experience. Book now with t.lucas Transfers." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="512x512" href="/img/t_lucas_favicon.png" />
  <link rel="apple-touch-icon" href="/img/t_lucas_favicon.png" />

  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://transfersgo.pt">
  <link rel="preconnect" href="https://images.unsplash.com">

  <!-- Google Fonts — non-render-blocking -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet">
  </noscript>
</head>

<body>
  <div id="scroll-progress"></div>
  <div id="root"></div>
  <script>
    window.addEventListener('scroll', () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      document.getElementById('scroll-progress').style.width = scrolled + "%";
    }, { passive: true });
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
